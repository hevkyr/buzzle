<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>buzzle — motivational nonsense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #7cf5b0;
    --accent2: #5b8eff;
    --accent3: #ff6b6b;
    --text: #e8e8f0;
    --muted: #555570;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Grid background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,245,176,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,245,176,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Noise overlay ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* ── Header ── */
  header {
    margin-bottom: 64px;
    animation: fadeUp 0.6s ease both;
  }

  .logo {
    font-family: var(--font-display);
    font-size: clamp(48px, 8vw, 80px);
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .tagline {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .tagline span {
    color: var(--accent);
  }

  /* ── Main card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s ease 0.1s both;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  /* ── Phrase display ── */
  .phrase-area {
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-bottom: 32px;
  }

  .phrase-text {
    font-family: var(--font-display);
    font-size: clamp(20px, 3vw, 26px);
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    transition: opacity 0.2s;
  }

  .phrase-text.loading {
    opacity: 0.3;
  }

  .phrase-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .stars {
    color: var(--accent);
    font-size: 16px;
    letter-spacing: 2px;
  }

  .badge {
    font-size: 10px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .score-bar {
    flex: 1;
    min-width: 100px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0%;
  }

  .score-label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover {
    background: #a8ffcc;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124, 245, 176, 0.3);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-primary.spinning::after {
    content: '...';
    animation: blink 0.6s steps(3) infinite;
  }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--muted);
    color: var(--text);
  }

  /* ── Count selector ── */
  .count-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .count-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .count-btns {
    display: flex;
    gap: 6px;
  }

  .count-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    width: 36px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .count-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .count-btn:hover {
    border-color: var(--muted);
    color: var(--text);
  }

  /* ── Phrase list ── */
  .phrase-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 32px;
  }

  .phrase-item {
    padding: 16px 20px;
    border-left: 2px solid var(--border);
    animation: slideIn 0.3s ease both;
    transition: border-color 0.2s;
  }

  .phrase-item:hover {
    border-color: var(--accent);
  }

  .phrase-item-text {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .phrase-item-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .phrase-item-stars {
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* ── Custom section ── */
  .custom-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 40px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s ease 0.2s both;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .field-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .field-input {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    width: 100%;
    transition: border-color 0.15s;
    outline: none;
  }

  .field-input::placeholder { color: var(--muted); }

  .field-input:focus {
    border-color: var(--accent2);
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-top: 48px;
    animation: fadeUp 0.6s ease 0.3s both;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* ── Status dot ── */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 48px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .status-dot.online {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }

  .status-dot.offline {
    background: var(--accent3);
  }

  /* ── Copy toast ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #000;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 8px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @keyframes blink {
    0%   { content: '.'; }
    33%  { content: '..'; }
    66%  { content: '...'; }
  }

  .cursor-blink::after {
    content: '█';
    animation: pulse 1s steps(1) infinite;
    color: var(--accent);
    font-size: 0.8em;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">buzzle</div>
    <div class="tagline">motivational nonsense · <span>as a service</span></div>
  </header>

  <!-- API Status -->
  <div class="status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">checking api...</span>
  </div>

  <!-- Main phrase card -->
  <div class="card">
    <div class="count-row">
      <span class="count-label">count</span>
      <div class="count-btns" id="count-btns">
        <button class="count-btn active" data-count="1">1</button>
        <button class="count-btn" data-count="3">3</button>
        <button class="count-btn" data-count="5">5</button>
        <button class="count-btn" data-count="10">10</button>
      </div>
    </div>

    <!-- Single phrase display -->
    <div class="phrase-area" id="single-area">
      <div class="phrase-text cursor-blink" id="phrase-text">
        Press generate to receive wisdom.
      </div>
      <div class="phrase-meta" id="phrase-meta" style="display:none">
        <div class="stars" id="stars"></div>
        <div class="score-bar"><div class="score-fill" id="score-fill"></div></div>
        <div class="score-label" id="score-label"></div>
        <div class="badge" id="category-badge"></div>
      </div>
    </div>

    <!-- Multi phrase list -->
    <div class="phrase-list" id="phrase-list" style="display:none"></div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-generate">generate</button>
      <button class="btn btn-secondary" id="btn-copy" style="display:none">copy</button>
      <button class="btn btn-secondary" id="btn-seed">seed: random</button>
    </div>
  </div>

  <!-- Custom phrase card -->
  <div class="custom-card">
    <div class="section-title">custom phrase</div>
    <div class="fields">
      <div class="field-wrap">
        <div class="field-label">noun</div>
        <input class="field-input" id="custom-noun" placeholder="capybara" maxlength="30">
      </div>
      <div class="field-wrap">
        <div class="field-label">verb</div>
        <input class="field-input" id="custom-verb" placeholder="deploys" maxlength="30">
      </div>
      <div class="field-wrap">
        <div class="field-label">adjective</div>
        <input class="field-input" id="custom-adj" placeholder="caffeinated" maxlength="30">
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="btn-custom">generate custom</button>
    </div>
    <div class="phrase-area" id="custom-area" style="min-height:60px; margin-top:20px; margin-bottom:0">
      <div class="phrase-text" id="custom-phrase-text" style="font-size:18px; color: var(--muted)">
        fill the fields above ↑
      </div>
    </div>
  </div>

  <footer>
    <p>built by <a href="https://github.com/hevkyr">hevkyr</a> · python + go + lua + docker · MIT</p>
    <p style="margin-top:6px"><a href="https://github.com/hevkyr/buzzle" target="_blank">github.com/hevkyr/buzzle</a> · engine runs locally in your browser</p>
  </footer>
</div>

<div class="toast" id="toast">copied!</div>

<script>
  // ══════════════════════════════════════════════════════════════════════════
  //  buzzle engine — offline JS port (no API required)
  //  identical logic to api/engine.py, runs 100% in the browser
  // ══════════════════════════════════════════════════════════════════════════

  // ── Word banks ─────────────────────────────────────────────────────────────
  const NOUNS = [
    "cactus","penguin","developer","spreadsheet","deadline","WiFi",
    "database","standup","pivot","synergy","bandwidth","roadmap",
    "kanban","agile","scrum","backlog","notebook","thermostat",
    "centipede","avocado","algorithm","404","commit","merge",
    "hotdog","hamster","blockchain","cloud","stack","pipeline",
    "rubber duck","semicolon","namespace","daemon","socket",
    "iterator","refactor","dockerfile","linter","grep",
    "coffee","monitor","keyboard","cursor","variable","function",
    "exception","timeout","latency","throughput","entropy",
    "csv","json","yaml","regex","terminal","session",
    "dependency","abstraction","singleton","mutex","thread",
    "garbage collector","heap","lobster","flamingo","ferret",
    "echidna","capybara","sourdough","kombucha","oat milk","intern",
  ];

  const VERBS = [
    "apologizes","refactors","deploys","compiles","pivots",
    "disrupts","leverages","synergizes","scales","iterates",
    "optimizes","bootstraps","migrates","containerizes","commits",
    "branches","merges","rebases","lints","formats",
    "debugs","logs","monitors","alerts","retries",
    "timeouts","caches","indexes","queries","joins",
    "validates","serializes","parses","renders","hydrates",
    "memoizes","delegates","encapsulates","abstracts","inherits",
    "overrides","implements","integrates","automates","orchestrates",
    "provisions","configures","patches","ships","rolls back",
  ];

  const ADJECTIVES = [
    "disciplined","caffeinated","confused","agile","distributed",
    "asynchronous","idempotent","stateless","immutable","resilient",
    "scalable","observable","containerized","decoupled","abstracted",
    "overengineered","deprecated","legacy","bleeding-edge","robust",
    "blazing-fast","cloud-native","data-driven","AI-powered","minimal",
    "opinionated","verbose","elegant","pragmatic","recursive",
    "lazy","eager","strict","loosely-coupled","eventually-consistent",
    "self-healing","fault-tolerant","horizontally-scalable","serverless",
    "headless","passwordless","frictionless","seamless","effortless",
  ];

  const PREPOSITIONS = [
    "to","toward","against","beyond","despite",
    "through","within","without","alongside","underneath",
  ];

  const TEMPLATES = [
    "The {adj} {noun} never {verb} {prep} {noun2}.",
    "{VERB} harder than your {noun}'s {noun2}.",
    "A {adj} {noun} still knows its {noun2} encoding.",
    "Never let a {adj} {noun} {verb} your {noun2}.",
    "The {noun} that {verb} {prep} {noun2} is already {adj}.",
    "In a world of {noun2}, be the {adj} {noun}.",
    "Your {noun} will {verb} {prep} {noun2} before the sprint ends.",
    "Stay {adj}. Deploy on Fridays. Become the {noun}.",
  ];

  const CATEGORIES = ["hustle","tech","mindset","chaos","enlightenment"];

  // ── Seeded PRNG (mulberry32) ───────────────────────────────────────────────
  function makePRNG(seed) {
    let s = seed >>> 0;
    return () => {
      s += 0x6D2B79F5;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function pick(arr, rng) {
    return arr[Math.floor(rng() * arr.length)];
  }

  // ── Profoundness score ────────────────────────────────────────────────────
  function syllableCount(word) {
    word = word.toLowerCase().replace(/[^a-z]/g, '');
    let count = 0, prev = false;
    for (const ch of word) {
      const v = 'aeiouy'.includes(ch);
      if (v && !prev) count++;
      prev = v;
    }
    return Math.max(1, count);
  }

  function profoundnessScore(phrase, rng) {
    const words = phrase.split(' ');
    const syllables = words.reduce((s, w) => s + syllableCount(w), 0);
    const avgLen = words.reduce((s, w) => s + w.replace(/[^a-z]/gi,'').length, 0) / Math.max(words.length, 1);
    const noise = Math.floor(rng() * 15);
    return Math.max(1, Math.min(100, Math.round(syllables * 4.2 + avgLen * 6.1 + noise)));
  }

  // ── Core generator ────────────────────────────────────────────────────────
  function generatePhrase({ seed = null, noun = null, verb = null, adjective = null } = {}) {
    const rng = seed !== null ? makePRNG(seed) : Math.random.bind(Math);

    const n1  = noun      || pick(NOUNS, rng);
    const n2  = pick(NOUNS.filter(n => n !== n1), rng);
    const v   = verb      || pick(VERBS, rng);
    const adj = adjective || pick(ADJECTIVES, rng);
    const prep = pick(PREPOSITIONS, rng);
    const tmpl = pick(TEMPLATES, rng);

    let phrase = tmpl
      .replace('{adj}',  adj)
      .replace('{noun}', n1)
      .replace('{noun2}', n2)
      .replace('{VERB}', v.charAt(0).toUpperCase() + v.slice(1))
      .replace('{verb}', v)
      .replace('{prep}', prep);

    phrase = phrase.charAt(0).toUpperCase() + phrase.slice(1);
    if (!'.!?'.includes(phrase.at(-1))) phrase += '.';

    const score    = profoundnessScore(phrase, rng);
    const category = pick(CATEGORIES, rng);

    return { phrase, score, category, generated_at: new Date().toISOString() };
  }

  function generateMultiple(count = 5, seed = null) {
    count = Math.max(1, Math.min(count, 20));
    const results = [], seen = new Set();
    let attempts = 0;
    while (results.length < count && attempts < count * 5) {
      const s = seed !== null ? seed + attempts : null;
      const p = generatePhrase({ seed: s });
      if (!seen.has(p.phrase)) { seen.add(p.phrase); results.push(p); }
      attempts++;
    }
    return results;
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  UI
  // ══════════════════════════════════════════════════════════════════════════

  let currentCount  = 1;
  let currentPhrase = '';
  let useSeed       = false;
  let currentSeed   = null;
  let generating    = false;

  const phraseText    = document.getElementById('phrase-text');
  const phraseMeta    = document.getElementById('phrase-meta');
  const phraseList    = document.getElementById('phrase-list');
  const singleArea    = document.getElementById('single-area');
  const scoreBar      = document.getElementById('score-fill');
  const scoreLabel    = document.getElementById('score-label');
  const starsEl       = document.getElementById('stars');
  const categoryBadge = document.getElementById('category-badge');
  const btnGen        = document.getElementById('btn-generate');
  const btnCopy       = document.getElementById('btn-copy');
  const btnSeed       = document.getElementById('btn-seed');
  const statusDot     = document.getElementById('status-dot');
  const statusText    = document.getElementById('status-text');
  const toast         = document.getElementById('toast');
  const customResult  = document.getElementById('custom-phrase-text');

  // Mark engine as online (no API needed)
  statusDot.className  = 'status-dot online';
  statusText.textContent = 'engine online · running locally in your browser';

  // ── Helpers ────────────────────────────────────────────────────────────────
  function starsFromScore(score) {
    const full = Math.floor(score / 20);
    return '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Count buttons ──────────────────────────────────────────────────────────
  document.getElementById('count-btns').addEventListener('click', e => {
    const btn = e.target.closest('.count-btn');
    if (!btn) return;
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCount = parseInt(btn.dataset.count);
    if (currentCount === 1) {
      singleArea.style.display = 'flex';
      phraseList.style.display = 'none';
    } else {
      singleArea.style.display = 'none';
      phraseList.style.display = 'flex';
    }
  });

  // ── Seed toggle ────────────────────────────────────────────────────────────
  btnSeed.addEventListener('click', () => {
    useSeed = !useSeed;
    if (useSeed) {
      currentSeed = Math.floor(Math.random() * 999999);
      btnSeed.textContent = `seed: ${currentSeed}`;
      btnSeed.style.borderColor = 'var(--accent2)';
      btnSeed.style.color = 'var(--accent2)';
    } else {
      currentSeed = null;
      btnSeed.textContent = 'seed: random';
      btnSeed.style.borderColor = '';
      btnSeed.style.color = '';
    }
  });

  // ── Generate ───────────────────────────────────────────────────────────────
  btnGen.addEventListener('click', run);

  function run() {
    if (generating) return;
    generating = true;
    btnGen.textContent = 'generating';
    phraseText.classList.add('loading');

    // Tiny async delay so the UI updates before the (instant) computation
    setTimeout(() => {
      try {
        if (currentCount === 1) {
          displaySingle(generatePhrase({ seed: currentSeed }));
        } else {
          displayMultiple(generateMultiple(currentCount, currentSeed));
        }
      } finally {
        generating = false;
        btnGen.textContent = 'generate';
        phraseText.classList.remove('loading');
      }
    }, 80);
  }

  function displaySingle(data) {
    currentPhrase = data.phrase;
    phraseText.textContent = data.phrase;
    phraseMeta.style.display = 'flex';
    btnCopy.style.display = 'block';
    starsEl.textContent = starsFromScore(data.score);
    scoreLabel.textContent = `${data.score}/100`;
    categoryBadge.textContent = data.category;
    requestAnimationFrame(() => { scoreBar.style.width = data.score + '%'; });
  }

  function displayMultiple(phrases) {
    phraseList.innerHTML = '';
    phrases.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'phrase-item';
      el.style.animationDelay = `${i * 0.05}s`;
      el.innerHTML = `
        <div class="phrase-item-text">${escapeHtml(p.phrase)}</div>
        <div class="phrase-item-meta">
          <span class="phrase-item-stars">${starsFromScore(p.score)}</span>
          <span>${p.score}/100</span>
          <span>${p.category}</span>
        </div>`;
      el.addEventListener('click', () => {
        navigator.clipboard.writeText(p.phrase);
        showToast('copied!');
      });
      phraseList.appendChild(el);
    });
  }

  // ── Copy ───────────────────────────────────────────────────────────────────
  btnCopy.addEventListener('click', () => {
    if (!currentPhrase) return;
    navigator.clipboard.writeText(currentPhrase);
    showToast('copied!');
  });

  // ── Custom phrase ──────────────────────────────────────────────────────────
  document.getElementById('btn-custom').addEventListener('click', () => {
    const noun = document.getElementById('custom-noun').value.trim() || null;
    const verb = document.getElementById('custom-verb').value.trim() || null;
    const adj  = document.getElementById('custom-adj').value.trim() || null;

    const data = generatePhrase({ noun, verb, adjective: adj });
    customResult.textContent = data.phrase;
    customResult.style.color = 'var(--text)';
  });

  // ── Keyboard shortcut ──────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.target.matches('input')) run();
  });

  // ── Auto-generate one phrase on load ──────────────────────────────────────
  run();
</script>
</body>
</html>
